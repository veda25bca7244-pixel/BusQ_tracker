  <div id="root"></div>

      const [selectedStop, setSelectedStop] = useState({

      const [alertPreference, setAlertPreference] = useState("5 mins");
      const [activeAlerts, setActiveAlerts] = useState([

          time: "2m ago",

          nextStop: "VIT-AP University (Terminal Hub)",

        {

          label: "21",

          driver: "Vikramjit Singh",
          driverPhone: "+91 97312 90445",
          plate: "KA-04-G-7733",
          status: "Express Transit",
          statusType: "fast",

      const triggerToast = (msg) => {
        setToast(msg);

      return (

          alertPreference, setAlertPreference,
          activeAlerts, setActiveAlerts,

    const useTransit = () => useContext(TransitContext);

    // --- REUSABLE UI DIALOG / TOAST ---
    const GlobalModals = () => {
      const { dialog, closeDialog, toast, setToast } = useTransit();

      return (
        <Fragment>
          {toast && (
            <div className="fixed top-4 inset-x-4 max-w-sm mx-auto z-[9999] bg-[#09090b] text-white px-4 py-3 rounded-2xl shadow-2xl flex items-center justify-between border border-purple-500/40 animate-bounce">
              <div className="flex items-center gap-2.5">
                <span className="material-symbols-outlined text-purple-400 text-[20px]">info</span>
                <span className="text-[13px] font-medium">{toast}</span>
              </div>
              <button onClick={() => setToast(null)} className="text-purple-300 ml-2 hover:text-white">✕</button>
            </div>
          )}

          {dialog && (
            <div className="fixed inset-0 z-[9999] bg-[#09090b]/75 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="w-full max-w-sm bg-white rounded-3xl p-5 shadow-2xl border border-purple-100 flex flex-col gap-3">
                <div className="flex items-center gap-2 text-primary font-bold text-[17px]">
                  <span className="material-symbols-outlined text-[24px]">contact_support</span>
                  <h3>{dialog.title || "BusQ Confirmation"}</h3>
                </div>
                <p className="text-[14px] text-on-surface-variant leading-relaxed">{dialog.msg}</p>
                <div className="flex items-center justify-end gap-2 pt-2">
                  {dialog.showCancel && (
                    <button
                      onClick={closeDialog}
                      className="px-4 py-2 rounded-xl text-[13px] font-semibold text-on-surface-variant hover:bg-purple-50 transition-colors"
                    >
                      Cancel
                    </button>
                  )}
                  <button
                    onClick={() => {
                      if (dialog.onConfirm) dialog.onConfirm();
                      closeDialog();
                    }}
                    className="px-5 py-2.5 rounded-xl bg-primary text-white text-[13px] font-bold shadow-md hover:bg-purple-800 transition-colors"
                  >
                    Confirm
                  </button>
                </div>
              </div>
            </div>
          )}
        </Fragment>
      );
    };

    // --- HEADER COMPONENT ---
    const AppHeader = ({ title = "BusQ", subtitle, onBack }) => {
      const navigate = useNavigate();
      const { role } = useTransit();

      return (
        <header className="fixed top-0 w-full z-50 bg-[#fcf8fb]/95 backdrop-blur-xl border-b border-purple-100 shadow-[0_1px_8px_rgba(109,40,217,0.06)]">
          <div className="h-16 px-4 max-w-xl mx-auto flex items-center justify-between">
            <div className="flex items-center gap-2">
              {onBack ? (
                <button 
                  onClick={onBack} 
                  aria-label="Go Back"
                  className="min-h-[44px] min-w-[44px] -ml-2 flex items-center justify-center text-on-surface active:scale-90 transition-transform"
                >
                  <span className="material-symbols-outlined text-[24px]">arrow_back</span>
                </button>
              ) : null}
              <div 
                className="flex items-center gap-2 cursor-pointer"
                onClick={() => navigate(role === 'admin' ? '/admin-profile' : '/home')}
              >
                <div className="w-8 h-8 rounded-lg bg-primary text-white flex items-center justify-center shadow-sm">
                  <span className="material-symbols-outlined text-[20px]">directions_bus</span>
                </div>
                <div className="flex flex-col">
                  <span className="text-[17px] font-bold text-primary tracking-tight leading-tight">{title}</span>
                  {subtitle && <span className="text-[11px] text-on-surface-variant font-medium leading-none">{subtitle}</span>}
                </div>
              </div>
            </div>

            <div className="flex items-center gap-2">
              <button 
                onClick={() => navigate('/emergency')}

                className="h-9 px-3 rounded-full bg-error-container text-error flex items-center justify-center gap-1 active:scale-95 transition-transform"
              >
                <span className="relative flex h-2 w-2">
                  <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-error opacity-75"></span>
                  <span className="relative inline-flex rounded-full h-2 w-2 bg-error"></span>
                </span>
                <span className="material-symbols-outlined text-[18px]">emergency</span>
                <span className="text-[11px] uppercase tracking-wider font-bold">SOS</span>
              </button>

                onClick={() => navigate(role === 'admin' ? '/admin-profile' : '/profile')}

                  className="w-full h-full object-cover"

                    ? "https://lh3.googleusercontent.com/aida-public/AB6AXuA0B-R_M6PtQPoSYENsxY2XzssP33VZzzORY3WUTfGA8h8NK0qekdQB_nuscnkXy1SThsY4UgqznrxOBTy9QHk1f_kJsUtgzSWg0uGj-dI-nn9nyHB2Bj1SdGOCKyQOpxMVstvI_6laYuppPw7PbFtkketIU6xUw4uMCpUxuHnT6hKGUHV3o2haSLYGDX2KopmaGgQ6PEJSbALdgRkgieGrak62EPPFYn5wy1gWbYb2cz6sXYhAk1JL"
                    : "https://lh3.googleusercontent.com/aida-public/AB6AXuDhWsvqcRvGrakUc7HixtsbuTd4lQJhbSg5wqi8hgSXhuQYufi5TIY3SOJeOctbszTrw-7s0EKIVnFz0l9rgVdWyYBGhK1LsWC0J7QUEncPWZi36KOID13rLUo8luAjtnwTDXD0Eu8gRnK7A21oIH0bvfoG1j1WbH_6YQ3NKDCul33MLh1lrnmJh2_Teo1U6nj_8DUGic4qLr87A2r7iuvWm8rlh1jIxs0p8gbkmo1B8cVETjTqv556"
                  }
                />
              </button>
            </div>
          </div>

      );
    };

    // --- BOTTOM NAVIGATION COMPONENT ---
    const BottomNavigation = ({ current = "home" }) => {
      const navigate = useNavigate();
      const { role, activeAlerts } = useTransit();
      const unreadCount = activeAlerts.filter(a => a.isUnread).length;

      if (role === 'admin') {
        const adminTabs = [
          { id: 'fleet-hub', path: '/home', label: 'Fleet Hub', icon: 'local_shipping' },
          { id: 'routes', path: '/route-details', label: 'Routes', icon: 'alt_route' },

                  <span className="material-symbols-outlined text-[22px]">{tab.icon}</span>
                  <span className="text-[11px] font-mono tracking-tight">{tab.label}</span>

        <nav className="fixed bottom-0 w-full z-50 pb-safe bg-surface-container-lowest/95 backdrop-blur-xl shadow-[0_-2px_12px_rgba(109,40,217,0.06)] border-t border-purple-100/60">

      const { setRole, triggerToast, setDialog } = useTransit();
      const [localRole, setLocalRole] = useState("student");

        setLocalRole(newRole);
        setUserId(newRole === "student" ? "CS-2024-8841" : "ME-2024-5120");

      const handleSignIn = () => {
        setRole(localRole);
        triggerToast(`Signed in successfully as ${localRole === 'student' ? 'Student' : 'Supervisor'}!`);
        if (localRole === "student") {
          navigate("/home");
        } else {
          navigate("/admin-profile");
        }

      return (
        <div className="flex flex-col min-h-screen bg-[#fcf8fb] pt-safe pb-safe max-w-xl mx-auto w-full px-4 py-6 select-none">
          {/* Brand header */}
          <div className="flex flex-col items-center text-center mt-2 space-y-2">
            <div className="relative flex items-center justify-center w-16 h-16 rounded-xl bg-purple-50 shadow-sm border border-purple-100">
              <span className="material-symbols-outlined text-[36px] text-primary">directions_bus</span>
              <span className="absolute -bottom-1 -right-1 flex h-3.5 w-3.5">
                <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-purple-400 opacity-75"></span>
                <span className="relative inline-flex rounded-full h-3.5 w-3.5 bg-violet-700"></span>

              <span className="material-symbols-outlined text-primary text-[32px]">hub</span>

                <span className="text-[11px] uppercase tracking-wider font-semibold">Live Campus Network</span>

              <p className="text-[16px] font-semibold text-[#0f0f11] leading-snug truncate">North &amp; South Shuttles Active</p>
              <p className="text-[13px] text-purple-900/70 truncate">Next departure from Central Quad in 4 mins</p>
            </div>
          </div>

          {/* Role Switcher */}
          <div className="mt-5 w-full bg-purple-100/70 p-1 rounded-xl flex items-center">
            <button 
              type="button"
              onClick={() => handleRoleSwitch("student")}
              className={`flex-1 flex items-center justify-center space-x-1.5 py-2.5 rounded-lg font-semibold text-[14px] transition-all ${localRole === 'student' ? 'bg-primary text-white shadow-sm' : 'text-purple-900/60 hover:text-purple-950'}`}
            >
              <span className="material-symbols-outlined text-[18px]">school</span>
              <span>Student</span>
            </button>
            <button 
              type="button"
              onClick={() => handleRoleSwitch("admin")}
              className={`flex-1 flex items-center justify-center space-x-1.5 py-2.5 rounded-lg font-semibold text-[14px] transition-all ${localRole === 'admin' ? 'bg-primary text-white shadow-sm' : 'text-purple-900/60 hover:text-purple-950'}`}
            >
              <span className="material-symbols-outlined text-[18px]">badge</span>
              <span>Admin</span>
            </button>
          </div>

          <form className="mt-5 flex flex-col space-y-4" onSubmit={(e) => { e.preventDefault(); handleSignIn(); }}>
            <div className="flex flex-col space-y-1.5">
              <div className="flex items-center justify-between">
                <label className="text-[12px] font-semibold text-[#18181b]">
                  {localRole === 'student' ? 'Student Roll / ID No.' : 'Staff / Supervisor Badge ID'}
                </label>
                <span className="text-[11px] text-violet-700 font-semibold">
                  {localRole === 'student' ? 'Student Account' : 'Administrative Clearance'}

      // Refs to the exact SVG route path elements
      const path14Ref = React.useRef(null);
      const path08Ref = React.useRef(null);
      const path21Ref = React.useRef(null);

      // Exact sampled (x, y) coordinates on the route paths
      const [bus14Pos, setBus14Pos] = useState({ x: 50, y: 60 });
      const [bus08Pos, setBus08Pos] = useState({ x: 60, y: 380 });
      const [bus21Pos, setBus21Pos] = useState({ x: 360, y: 30 });

      // Continuous, exact path progression along route lines using getPointAtLength
      useEffect(() => {
        let animFrameId;
        const startTime = performance.now();

        const updatePositions = (now) => {
          const elapsed = (now - startTime) / 1000; // in seconds

          // Progress cycles: 0.0 -> 1.0 (converging at VIT-AP terminal at end of line)
          // Staggered loop speeds for realistic transit motion
          const progress14 = (elapsed * 0.065) % 1; 
          const progress08 = (elapsed * 0.055) % 1; 
          const progress21 = (elapsed * 0.075) % 1; 

          if (path14Ref.current) {
            try {
              const len = path14Ref.current.getTotalLength();
              const pt = path14Ref.current.getPointAtLength(progress14 * len);
              setBus14Pos({ x: pt.x, y: pt.y });
            } catch (e) {}
          }

          if (path08Ref.current) {
            try {
              const len = path08Ref.current.getTotalLength();
              const pt = path08Ref.current.getPointAtLength(progress08 * len);
              setBus08Pos({ x: pt.x, y: pt.y });
            } catch (e) {}
          }

          if (path21Ref.current) {
            try {
              const len = path21Ref.current.getTotalLength();
              const pt = path21Ref.current.getPointAtLength(progress21 * len);
              setBus21Pos({ x: pt.x, y: pt.y });
            } catch (e) {}
          }

          animFrameId = requestAnimationFrame(updatePositions);
        };

        animFrameId = requestAnimationFrame(updatePositions);
        return () => cancelAnimationFrame(animFrameId);

                <div className="flex items-center gap-1">
                  <span className="material-symbols-outlined text-purple-200 text-[18px]">badge</span>
                  <span className="text-[10px] font-mono text-purple-200 uppercase tracking-wider">Transport Directorate</span>
                </div>
                <span className="px-2 py-0.5 rounded-full bg-primary-container text-white text-[10px] font-bold">
                  {adminUser.tier}
                </span>
              </div>

              <div className="mt-3 flex items-center gap-3">
                <img 
                  alt="Rahul Verma"
                  className="w-14 h-14 rounded-xl object-cover border border-purple-300/40"
                  src="https://lh3.googleusercontent.com/aida-public/AB6AXuA0B-R_M6PtQPoSYENsxY2XzssP33VZzzORY3WUTfGA8h8NK0qekdQB_nuscnkXy1SThsY4UgqznrxOBTy9QHk1f_kJsUtgzSWg0uGj-dI-nn9nyHB2Bj1SdGOCKyQOpxMVstvI_6laYuppPw7PbFtkketIU6xUw4uMCpUxuHnT6hKGUHV3o2haSLYGDX2KopmaGgQ6PEJSbALdgRkgieGrak62EPPFYn5wy1gWbYb2cz6sXYhAk1JL"
                />
                <div className="min-w-0 flex-1">
                  <h2 className="text-[17px] font-bold text-white truncate">{adminUser.name}</h2>
                  <p className="text-[12px] text-gray-300 truncate">{adminUser.role}</p>
                  <p className="text-[11px] font-mono text-purple-300">ID: {adminUser.id}</p>
                </div>
              </div>

              <div className="mt-3 pt-2 border-t border-white/10 grid grid-cols-2 gap-2">
                <button 
                  onClick={handleNfc}
                  className="h-10 rounded-lg bg-white text-[#09090b] text-[12px] font-bold flex items-center justify-center gap-1 shadow-xs active:scale-95 transition-transform"
                >
                  <span className="material-symbols-outlined text-[16px] text-primary">contactless</span>
                  <span>{nfcActive ? "Transmitting..." : "NFC Access"}</span>
                </button>
                <button 
                  onClick={() => triggerToast("Digital supervisor pass exported.")}
                  className="h-10 rounded-lg bg-white/20 text-white text-[12px] font-bold flex items-center justify-center gap-1 active:scale-95 transition-transform"
                >
                  <span className="material-symbols-outlined text-[16px]">share</span>
                  <span>Digital Pass</span>
                </button>
              </div>
            </div>

            {/* Shift Metrics */}
            <div className="bg-white rounded-xl p-4 shadow-xs border border-purple-100 space-y-3">
              <div className="flex items-center justify-between">
                <h3 className="text-[15px] font-bold text-[#09090b]">Shift Fleet Metrics</h3>
                <span className="text-[10px] font-mono px-2 py-0.5 rounded-full bg-purple-100 text-primary font-bold">
                  3 ACTIVE UNITS TRACKED
                </span>
              </div>

              <div className="grid grid-cols-3 gap-2 text-center">
                <div className="bg-[#f5f3ff] rounded-lg p-2.5">
                  <span className="block text-[18px] font-extrabold text-primary font-mono">{adminFleet.length}</span>
                  <span className="text-[11px] text-on-surface-variant">Fleet In Ops</span>
                </div>
                <div className="bg-[#f5f3ff] rounded-lg p-2.5">
                  <span className="block text-[18px] font-extrabold text-[#09090b] font-mono">3</span>
                  <span className="text-[11px] text-on-surface-variant">Active Routes</span>
                </div>
                <div className="bg-[#f5f3ff] rounded-lg p-2.5">
                  <span className="block text-[18px] font-extrabold text-emerald-700 font-mono">98.4%</span>
                  <span className="text-[11px] text-on-surface-variant">On-Time Index</span>
                </div>
              </div>

              <button 
                onClick={handleHandover}
                className="w-full h-10 rounded-lg bg-[#f0edf0] hover:bg-[#eae7ea] text-[#09090b] text-[12px] font-bold flex items-center justify-center gap-1.5 transition-colors"
              >
                <span className="material-symbols-outlined text-[18px] text-primary">swap_horiz</span>
                <span>Initiate Shift Handover Protocol</span>
              </button>
            </div>

            {/* DEDICATED ADMIN-ONLY FLEET MANAGEMENT & LIVE TELEMETRY SECTION */}
            <section className="bg-white rounded-2xl p-4 shadow-xs border border-purple-200/80 space-y-3">
              <div className="flex items-center justify-between">
                <div className="flex items-center gap-2">
                  <div className="w-8 h-8 rounded-lg bg-primary text-white flex items-center justify-center">
                    <span className="material-symbols-outlined text-[18px]">directions_bus</span>
                  </div>
                  <div>
                    <h3 className="text-[16px] font-bold text-[#09090b]">Active Fleet Live Status</h3>
                    <p className="text-[11px] text-on-surface-variant">Admin Console Telemetry • Visible to Dispatchers</p>
                  </div>
                </div>
                <span className="text-[10px] bg-purple-100 text-primary font-mono font-bold px-2 py-0.5 rounded-full">
                  Admin Only
                </span>
              </div>

              {/* Status Filter Chips */}
              <div className="flex items-center gap-1.5 bg-purple-50 p-1 rounded-xl overflow-x-auto no-scrollbar">
                {[
                  { id: "all", label: "All Vehicles (3)" },
                  { id: "active", label: "En Route" },
                  { id: "standby", label: "Boarding" },
                  { id: "fast", label: "Express" }
                ].map(chip => (
                  <button
                    key={chip.id}
                    onClick={() => setFleetFilter(chip.id)}
                    className={`px-3 py-1 rounded-lg text-[11px] font-bold whitespace-nowrap transition-all ${
                      fleetFilter === chip.id 
                        ? 'bg-primary text-white shadow-xs' 
                        : 'text-on-surface-variant hover:text-primary'
                    }`}
                  >
                    {chip.label}
                  </button>
                ))}
              </div>

              {/* All Fleet Units (Bus #14, Bus #08, Bus #21) */}
              <div className="space-y-3 pt-1">
                {filteredFleet.map(bus => (
                  <div 
                    key={bus.id}
                    className="p-3.5 rounded-xl border border-purple-100 bg-[#fcf8fb] hover:border-purple-300 transition-all shadow-xs flex flex-col gap-2.5"
                  >
                    {/* Header line */}
                    <div className="flex items-start justify-between">
                      <div className="flex items-center gap-2.5">
                        <div className="w-10 h-10 rounded-xl bg-[#09090b] text-white flex items-center justify-center font-bold text-[16px] shadow-sm">
                          {bus.label}
                        </div>
                        <div>
                          <div className="flex items-center gap-1.5 flex-wrap">
                            <h4 className="text-[15px] font-bold text-[#09090b]">{bus.number}</h4>
                            <span className="text-[10px] font-mono text-purple-700 bg-purple-100 px-1.5 py-0.5 rounded">
                              {bus.plate}
                            </span>
                          </div>
                          <span className="text-[11px] text-on-surface-variant block leading-tight">{bus.route}</span>
                        </div>
                      </div>

                      <div className="flex flex-col items-end">
                        <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold ${
                          bus.statusType === 'active' 
                            ? 'bg-purple-100 text-primary border border-purple-200' 
                            : bus.statusType === 'standby'
                            ? 'bg-amber-100 text-amber-900 border border-amber-200'
                            : 'bg-emerald-100 text-emerald-800 border border-emerald-200'
                        }`}>
                          <span className="w-1.5 h-1.5 rounded-full bg-current animate-pulse"></span>
                          {bus.status}
                        </span>
                        <span className="text-[10px] text-gray-500 font-mono mt-0.5">Ping: {bus.lastPing}</span>
                      </div>
                    </div>

                    {/* Operational Telemetry Grid */}
                    <div className="grid grid-cols-3 gap-2 bg-white rounded-lg p-2.5 border border-purple-100 text-center">
                      <div>
                        <span className="text-[10px] text-on-surface-variant uppercase block">Speed</span>
                        <span className="text-[13px] font-bold font-mono text-[#09090b]">{bus.speed}</span>
                      </div>
                      <div>
                        <span className="text-[10px] text-on-surface-variant uppercase block">Occupancy</span>
                        <span className="text-[13px] font-bold font-mono text-primary">{bus.occupancy}</span>
                      </div>
                      <div>
                        <span className="text-[10px] text-on-surface-variant uppercase block">Fuel / SoC</span>
                        <span className="text-[13px] font-bold font-mono text-emerald-700">{bus.fuel}</span>
                      </div>
                    </div>

                    {/* Route position tracker */}
                    <div className="text-[12px] bg-white rounded-lg p-2.5 border border-purple-100 flex flex-col gap-1">
                      <div className="flex items-center justify-between text-on-surface-variant">
                        <span className="flex items-center gap-1">
                          <span className="material-symbols-outlined text-[16px] text-primary">location_on</span>
                          <strong className="text-on-surface">{bus.currentLocation}</strong>
                        </span>
                        <span className="text-[11px] font-bold text-secondary">{bus.etaNext}</span>
                      </div>
                      <div className="flex items-center justify-between text-[11px] text-on-surface-variant pt-1 border-t border-purple-50">
                        <span>Driver: <strong className="text-on-surface">{bus.driver}</strong></span>
                        <a href={`tel:${bus.driverPhone.replace(/\s+/g, '')}`} className="text-primary hover:underline font-semibold flex items-center gap-0.5">
                          <span className="material-symbols-outlined text-[14px]">phone</span>
                          <span>Call</span>
                        </a>
                      </div>
                    </div>

                    {/* Supervisor Quick Actions */}
                    <div className="grid grid-cols-2 gap-2 pt-0.5">
                      <button 
                        onClick={() => handlePingTelemetry(bus)}
                        disabled={pingingBusId === bus.id}
                        className="h-8 rounded-lg bg-purple-50 hover:bg-purple-100 text-primary text-[11px] font-bold flex items-center justify-center gap-1 border border-purple-200 active:scale-95 transition-all"
                      >
                        <span className={`material-symbols-outlined text-[15px] ${pingingBusId === bus.id ? 'animate-spin' : ''}`}>
                          {pingingBusId === bus.id ? 'sync' : 'sensors'}
                        </span>
                        <span>{pingingBusId === bus.id ? 'Pinging GPS...' : 'Ping Telemetry'}</span>
                      </button>

                      <button 
                        onClick={() => handleEmergencyDispatch(bus)}
                        className="h-8 rounded-lg bg-[#09090b] hover:bg-zinc-800 text-white text-[11px] font-bold flex items-center justify-center gap-1 shadow-xs active:scale-95 transition-all"
                      >
                        <span className="material-symbols-outlined text-[15px] text-purple-300">send</span>
                        <span>Priority Order</span>
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            </section>

            {/* Master Control Dispatch Actions */}
            <div className="bg-white rounded-xl p-4 shadow-xs border border-purple-100 space-y-2">
              <h3 className="text-[15px] font-bold text-[#09090b]">Master Control Actions</h3>

              <div className="space-y-1.5">
                <button 
                  onClick={() => triggerToast("Broadcasting announcement to all 3 active shuttle drivers.")}
                  className="w-full p-2.5 rounded-lg bg-[#f6f2f5] hover:bg-purple-50 flex items-center justify-between text-left transition-colors"
                >
                  <div className="flex items-center gap-2.5">
                    <div className="w-8 h-8 rounded-lg bg-primary text-white flex items-center justify-center">
                      <span className="material-symbols-outlined text-[18px]">campaign</span>
                    </div>
                    <div>
                      <span className="text-[13px] font-bold text-[#09090b] block">Driver Fleet Broadcast</span>
                      <span className="text-[11px] text-on-surface-variant">Push bulletin to Bus #14, #08, #21</span>
                    </div>
                  </div>
                  <span className="material-symbols-outlined text-gray-400">chevron_right</span>
                </button>

                <button 
                  onClick={() => triggerToast("Detour activated for North Ring Road (+6 min).")}
                  className="w-full p-2.5 rounded-lg bg-[#f6f2f5] hover:bg-purple-50 flex items-center justify-between text-left transition-colors"
                >
                  <div className="flex items-center gap-2.5">
                    <div className="w-8 h-8 rounded-lg bg-amber-100 text-amber-900 flex items-center justify-center">
                      <span className="material-symbols-outlined text-[18px]">alt_route</span>
                    </div>
                    <div>
                      <span className="text-[13px] font-bold text-[#09090b] block">Roadblock Override</span>
                      <span className="text-[11px] text-on-surface-variant">North Ring detour (+6m)</span>
                    </div>
                  </div>
                  <span className="material-symbols-outlined text-gray-400">chevron_right</span>
                </button>

                <button 
                  onClick={() => navigate('/emergency')}
                  className="w-full p-2.5 rounded-lg bg-error-container text-on-error-container flex items-center justify-between text-left shadow-xs"
                >
                  <div className="flex items-center gap-2.5">
                    <div className="w-8 h-8 rounded-lg bg-error text-white flex items-center justify-center">
                      <span className="material-symbols-outlined text-[18px]">e911_emergency</span>
                    </div>
                    <div>
                      <span className="text-[13px] font-bold block">Campus SOS &amp; Police Relay</span>
                      <span className="text-[11px] opacity-90">Priority channel to Safety Control</span>
                    </div>
                  </div>
                  <span className="material-symbols-outlined">crisis_alert</span>
                </button>
              </div>
            </div>

            {/* Logout */}
            <div className="pt-2">
              <button 
                onClick={handleSignOut}
                className="w-full h-11 rounded-lg bg-error-container text-error text-[13px] font-bold flex items-center justify-center gap-2 active:scale-95 transition-transform"
              >
                <span className="material-symbols-outlined text-[18px]">logout</span>
                <span>Sign Out of Admin Console</span>
              </button>
            </div>
          </div>

          <BottomNavigation current="admin-profile" />
        </div>
      );
    };

    // --- APPLICATION ROUTING ENTRY POINT ---
    const App = () => {
      return (
        <TransitProvider>
          <MemoryRouter initialEntries={["/"]}>
            <GlobalModals />
            <Routes>
              <Route path="/" element={<LoginPage />} />
              <Route path="/home" element={<HomePage />} />
              <Route path="/track-bus" element={<TrackBusPage />} />
              <Route path="/route-details" element={<RouteDetailsPage />} />
              <Route path="/stop-selection" element={<StopSelectionPage />} />
              <Route path="/eta-countdown" element={<EtaCountdownPage />} />
              <Route path="/notifications" element={<NotificationsPage />} />
              <Route path="/profile" element={<ProfilePage />} />
              <Route path="/emergency" element={<EmergencyPage />} />
              <Route path="/admin-profile" element={<AdminProfilePage />} />
            </Routes>
          </MemoryRouter>
        </TransitProvider>
      );
    };

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
